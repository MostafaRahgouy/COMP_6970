<!DOCTYPE html>
<html lang="en">
<head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8X04QR1882"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='sign_in.css') }}">

</head>


<body>

<div class="top_section">
    <img src="{{ url_for('static', filename='images/au_logo.png') }}" alt="Auburn Logo" class="au_logo">
    <h1 class="top_title">AU Personal Fitness Center</h1>
</div>


<div class="content">
    <div class="signup_box">
        <h2>Sign In</h2>
        <form class="signup_form">
            <input type="text" placeholder="AU ID" required>
            <input type="password" placeholder="Password" required>


            <button type="submit" class="signup_btn">Sign In</button>
            <p class="signin_link">
                No account? <a href="/sign_up">Sign up here</a>
            </p>
        </form>
    </div>
</div>


<div id="blurOverlay"></div>
<div id="customAlert">
    <div id="customAlertMessage"></div>
    <button id="customAlertOkBtn">OK</button>
</div>



<script src="{{ url_for('static', filename='sign_in.js') }}"></script>

</body>


</html>
